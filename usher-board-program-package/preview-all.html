<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usher Board Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#08030d;color:#fff;font:600 15px Arial,sans-serif}header,main{max-width:1500px;margin:auto;padding-left:4%;padding-right:4%}header{padding-top:48px;padding-bottom:20px}header span{color:#d9b35d;letter-spacing:.2em;font-size:12px}h1{margin:12px 0;font-size:clamp(32px,5vw,70px)}p{color:#decbed}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;padding-top:20px;padding-bottom:80px}.meta{display:flex;justify-content:space-between;gap:12px;margin:0 0 10px}.meta b{font-size:16px}.meta a{color:#e5c46c;text-decoration:none;font-size:12px;letter-spacing:.1em}.shell{position:relative;aspect-ratio:16/9;overflow:hidden;background:#12051e;border:1px solid #68417e;box-shadow:0 18px 52px #0008}.shell iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}.camera{position:absolute;inset:0;z-index:2;display:grid;place-items:center;color:#fff3;font-weight:900;font-size:clamp(18px,3vw,42px);letter-spacing:.12em;pointer-events:none}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><span>FRANKLIN CHAPEL A.M.E. ZION CHURCH</span><h1>Usher Board Program</h1><p>Broadcast scene preview. Open any scene full size.</p></header><main id="gallery"></main><script>const scenes=[['00 • Welcome','welcome'],['01 • Starting Soon','soon'],['02 • Live Service','live',true],['03 • Lower Third','lowerthird',true],['04 • Program','program'],['07 • Closing','closing'],['T • Branded Transition','transition']];const gallery=document.querySelector('#gallery');scenes.forEach(([n,s,o])=>{const u=`index.html?scene=${s}${o?'&preview=1':''}`;const a=document.createElement('article');a.innerHTML=`<div class="meta"><b>${n}</b><a href="${u}" target="_blank">OPEN FULL SIZE ↗</a></div><div class="shell">${s==='live'?'<div class="camera">CAMERA AREA</div>':''}<iframe src="${u}"></iframe></div>`;gallery.append(a)});const resize=()=>document.querySelectorAll('.shell').forEach(x=>x.querySelector('iframe').style.transform=`scale(${x.clientWidth/1920})`);new ResizeObserver(resize).observe(gallery);resize()</script></body></html>
