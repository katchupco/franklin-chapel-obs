<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Franklin Chapel — Giving Overlay</title>
  <link rel="stylesheet" href="giving-overlay.css?v=3">
</head>
<body>
  <main class="giving-overlay" aria-label="Ways to give to Franklin Chapel">
    <section class="giving-heading">
      <div class="giving-logo"><img src="assets/franklin-lower-third-mark.png" alt="Franklin Chapel"></div>
      <div class="giving-heading-copy">
        <span>FRANKLIN CHAPEL</span>
        <strong>WAYS TO GIVE</strong>
      </div>
      <p>Your generosity makes ministry possible.</p>
    </section>

    <section class="giving-methods">
      <div class="giving-sheen" aria-hidden="true"></div>

      <article class="giving-method cashapp" style="--method-index:0">
        <div class="method-icon"><img src="assets/cash-app-official.svg" alt="Cash App"></div>
        <div class="method-copy">
          <span>CASH APP</span>
          <strong>$FRANKLINCHAPELNC</strong>
          <small>Send securely through Cash App</small>
        </div>
      </article>

      <article class="giving-method paypal" style="--method-index:1">
        <div class="method-icon"><img src="assets/paypal-official.svg" alt="PayPal"></div>
        <div class="method-copy">
          <span>PAYPAL</span>
          <strong>PAYPAL.ME/FRANKLINCHAPEL</strong>
          <small>Give securely with PayPal</small>
        </div>
      </article>

      <article class="giving-method online" style="--method-index:2">
        <div class="method-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M3.5 12h17M12 3c2.5 2.6 3.7 5.6 3.7 9S14.5 18.4 12 21c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3Z"></path></svg>
        </div>
        <div class="method-copy">
          <span>ONLINE GIVING</span>
          <strong>FRANKLINCHAPEL.ORG/GIVE</strong>
          <small>Give online from any device</small>
        </div>
      </article>
    </section>

    <div class="giving-accent-line" aria-hidden="true"><i></i></div>
  </main>
</body>
</html>
