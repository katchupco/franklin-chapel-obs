<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Back 2 School OBS Package Preview</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:34px;background:#08050d;color:#fff;font-family:Arial,Helvetica,sans-serif}header{max-width:1400px;margin:0 auto 28px}h1{margin:0;font-size:42px;letter-spacing:-.04em}p{color:#cbbfd2}.grid{max-width:1400px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}.card{overflow:hidden;border:1px solid rgba(255,255,255,.16);background:#130b1b;box-shadow:0 18px 45px rgba(0,0,0,.35)}.label{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;font-size:13px;font-weight:900;letter-spacing:.12em}.label b{color:#ffc400}.screen{position:relative;overflow:hidden;background:#050308}.screen iframe{position:absolute;left:0;top:0;display:block;width:1920px;height:1080px;border:0;transform-origin:0 0}@media(max-width:900px){.grid{grid-template-columns:1fr}body{padding:18px}}
  </style>
</head>
<body>
  <header><h1>BACK 2 SCHOOL SUNDAY</h1><p>Franklin Chapel OBS scene package • GitHub hosted</p></header>
  <main class="grid">
    <article class="card"><div class="label"><b>00</b><span>WELCOME</span></div><div class="screen"><iframe src="00-welcome.html?v=b2s-main-2"></iframe></div></article>
    <article class="card"><div class="label"><b>01</b><span>STARTING SOON</span></div><div class="screen"><iframe src="01-starting-soon.html?v=b2s-main-2"></iframe></div></article>
    <article class="card"><div class="label"><b>11</b><span>5-MINUTE COUNTDOWN</span></div><div class="screen"><iframe src="11-five-minute-countdown.html?v=b2s-main-2"></iframe></div></article>
    <article class="card"><div class="label"><b>02</b><span>LIVE WORSHIP OVERLAY</span></div><div class="screen"><iframe src="02-live-worship.html?v=b2s-main-2"></iframe></div></article>
    <article class="card"><div class="label"><b>03</b><span>SCRIPTURE</span></div><div class="screen"><iframe src="03-scripture.html?v=b2s-main-2"></iframe></div></article>
    <article class="card"><div class="label"><b>04</b><span>BACK 2 SCHOOL DETAILS</span></div><div class="screen"><iframe src="04-announcements.html?v=b2s-main-2"></iframe></div></article>
    <article class="card"><div class="label"><b>05</b><span>OFFERING</span></div><div class="screen"><iframe src="05-offering.html?v=b2s-main-2"></iframe></div></article>
    <article class="card"><div class="label"><b>06</b><span>BE RIGHT BACK</span></div><div class="screen"><iframe src="06-be-right-back.html?v=b2s-main-2"></iframe></div></article>
    <article class="card"><div class="label"><b>07</b><span>ENDING</span></div><div class="screen"><iframe src="07-ending.html?v=b2s-main-2"></iframe></div></article>
  </main>
  <script>
    const fitScenes=()=>document.querySelectorAll('.screen').forEach(screen=>{
      const scale=screen.clientWidth/1920;
      screen.style.height=`${1080*scale}px`;
      screen.querySelector('iframe').style.transform=`scale(${scale})`;
    });
    fitScenes();addEventListener('resize',fitScenes);
  </script>
</body>
</html>
