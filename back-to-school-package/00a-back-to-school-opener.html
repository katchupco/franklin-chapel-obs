<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Back 2 School Opener</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08040d;font-family:Arial Black,Arial,sans-serif}.scene{position:relative;width:100%;height:100%;isolation:isolate;color:#fff;background:radial-gradient(circle at 75% 24%,rgba(142,51,228,.62),transparent 34%),linear-gradient(120deg,#07030b 5%,#1b092a 48%,#4b1371 100%)}.paper{position:absolute;inset:0;z-index:-1;background:url("../assets/back-to-school/notebook-paper-texture.png") center/640px;opacity:.055;mix-blend-mode:screen}.slash{position:absolute;z-index:0;top:0;right:26%;width:3px;height:100%;background:linear-gradient(180deg,transparent 4%,rgba(255,198,0,.9) 27%,rgba(223,36,115,.8) 72%,transparent 96%);box-shadow:15px 0 0 -13px rgba(255,255,255,.45);transform:skewX(-20deg);opacity:.7}.bus-stage{position:absolute;z-index:0;right:-8%;bottom:2%;width:720px;height:405px;opacity:0;transform:translateX(260px);animation:busEnter 1.35s .35s cubic-bezier(.16,1,.3,1) forwards}.bus-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(-20px 22px 28px rgba(0,0,0,.58))}.bus-stage::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,4,15,.9) 0%,rgba(10,4,15,.3) 36%,transparent 65%);pointer-events:none}.bus-stage .lights{position:absolute;inset:0;background:url("../assets/back-to-school/bus-front-red-lights.png") center/contain no-repeat;mix-blend-mode:screen;animation:lights 2.2s 1.4s ease-in-out infinite}.logo{position:absolute;z-index:2;top:7.5%;left:7.5%;display:flex;align-items:center;gap:18px;letter-spacing:.15em;font-size:20px;opacity:0;animation:rise .55s .1s ease-out forwards}.logo img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 9px 18px rgba(0,0,0,.4))}.copy{position:absolute;z-index:2;left:7.5%;top:50%;transform:translateY(-50%)}.kicker{margin:0 0 18px;color:#ffc400;font-size:23px;letter-spacing:.24em;opacity:0;animation:rise .55s .32s ease-out forwards}.main{margin:0;font-size:clamp(110px,13.7vw,265px);line-height:.72;letter-spacing:-.09em;text-shadow:5px 6px 0 #df2473,13px 15px 0 rgba(83,18,122,.78),0 28px 62px rgba(0,0,0,.55);opacity:0;animation:headline .85s .45s cubic-bezier(.16,1,.3,1) forwards}.corner{position:absolute;z-index:2;right:7%;bottom:9%;padding:14px 18px;border-left:3px solid #ffc400;background:rgba(7,4,11,.68);font-size:16px;letter-spacing:.17em;opacity:0;animation:rise .6s 1.2s ease-out forwards}.wipe{position:absolute;z-index:5;inset:0;background:#ffc400;transform:translateX(-105%);animation:wipe 7s 3.5s cubic-bezier(.76,0,.24,1) infinite}@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes headline{from{opacity:0;transform:translateY(70px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes busEnter{to{opacity:.74;transform:translateX(0)}}@keyframes lights{0%,35%,100%{opacity:.16}43%,70%{opacity:.82}}@keyframes wipe{0%,10%{transform:translateX(-105%)}30%,100%{transform:translateX(105%)}}
  </style>
</head>
<body><main class="scene"><i class="paper"></i><i class="slash"></i><div class="bus-stage" aria-hidden="true"><img src="../assets/back-to-school/school-bus.png" alt=""><i class="lights"></i></div><div class="logo"><img src="../assets/franklin-lower-third-mark.png" alt=""><span>FRANKLIN CHAPEL</span></div><section class="copy"><p class="kicker">WE BELIEVE GOD</p><h1 class="main">BACK 2<br>SCHOOL</h1></section><div class="corner">A NEW SCHOOL YEAR<br>WITH FAITH IN FRONT</div><i class="wipe"></i></main></body>
</html>
