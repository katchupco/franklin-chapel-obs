<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Back 2 School Opener</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08040d;font-family:Arial Black,Arial,sans-serif}.scene{position:relative;width:100%;height:100%;isolation:isolate;color:#fff;background:radial-gradient(circle at 75% 24%,rgba(142,51,228,.62),transparent 34%),linear-gradient(120deg,#07030b 5%,#1b092a 48%,#4b1371 100%)}.paper{position:absolute;inset:0;z-index:-1;background:url("../assets/back-to-school/notebook-paper-texture.png") center/640px;opacity:.055;mix-blend-mode:screen}.slash{position:absolute;z-index:0;top:0;right:26%;width:3px;height:100%;background:linear-gradient(180deg,transparent 4%,rgba(255,198,0,.9) 27%,rgba(223,36,115,.8) 72%,transparent 96%);box-shadow:15px 0 0 -13px rgba(255,255,255,.45);transform:skewX(-20deg);opacity:.7}.bus-stage{position:absolute;z-index:0;right:-46%;bottom:-12%;width:1120px;height:630px;opacity:0;transform:translateX(520px);animation:busEnter 1.65s .35s cubic-bezier(.16,1,.3,1) forwards}.bus-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(-13px 15px 18px rgba(0,0,0,.42))}.bus-name{position:absolute;z-index:2;top:17.1%;left:23%;width:18%;color:rgba(247,244,246,.84);font-family:"Arial Narrow",Arial,sans-serif;font-size:clamp(15px,1.48vw,29px);font-weight:900;letter-spacing:.045em;line-height:1;text-align:center;text-shadow:0 1px 1px #140d17,0 0 4px rgba(255,255,255,.16);transform:perspective(420px) rotateY(-4deg) skewX(-2deg);filter:contrast(.92) blur(.12px)}.bus-lamp{position:absolute;z-index:3;top:17.2%;width:2.9%;aspect-ratio:1;border-radius:50%;opacity:.14;mix-blend-mode:screen;pointer-events:none}.lamp-red-left{left:20.4%;background:#ff172a;box-shadow:0 0 9px 4px rgba(255,24,42,.78);animation:redLamp 2.2s 1.55s ease-in-out infinite}.lamp-amber-left{left:23.2%;background:#ffb000;box-shadow:0 0 8px 4px rgba(255,176,0,.7);animation:amberLamp 2.2s 1.55s ease-in-out infinite}.lamp-amber-right{left:39.8%;background:#ffb000;box-shadow:0 0 8px 4px rgba(255,176,0,.7);animation:amberLamp 2.2s 1.55s ease-in-out infinite}.lamp-red-right{left:42.7%;background:#ff172a;box-shadow:0 0 9px 4px rgba(255,24,42,.78);animation:redLamp 2.2s 1.55s ease-in-out infinite}.logo{position:absolute;z-index:2;top:7.5%;left:7.5%;display:flex;align-items:center;gap:18px;letter-spacing:.15em;font-size:20px;opacity:0;animation:rise .55s .1s ease-out forwards}.logo img{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 9px 18px rgba(0,0,0,.4))}.copy{position:absolute;z-index:2;left:7.5%;top:50%;transform:translateY(-50%)}.kicker{margin:0 0 18px;color:#ffc400;font-size:23px;letter-spacing:.24em;opacity:0;animation:rise .55s .32s ease-out forwards}.main{margin:0;font-size:clamp(110px,13.7vw,265px);line-height:.72;letter-spacing:-.09em;text-shadow:5px 6px 0 #df2473,13px 15px 0 rgba(83,18,122,.78),0 28px 62px rgba(0,0,0,.55);opacity:0;animation:headline .85s .45s cubic-bezier(.16,1,.3,1) forwards}.corner{position:absolute;z-index:2;right:7%;bottom:9%;padding:14px 18px;border-left:3px solid #ffc400;background:rgba(7,4,11,.68);font-size:16px;letter-spacing:.17em;opacity:0;animation:rise .6s 1.2s ease-out forwards}@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes headline{from{opacity:0;transform:translateY(70px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes busEnter{to{opacity:.74;transform:translateX(0)}}@keyframes redLamp{0%,12%,46%,58%,100%{opacity:.12;filter:brightness(.75)}18%,38%,64%,84%{opacity:.72;filter:brightness(1.2)}}@keyframes amberLamp{0%,12%,46%,58%,100%{opacity:.68;filter:brightness(1.15)}18%,38%,64%,84%{opacity:.1;filter:brightness(.72)}}
  </style>
</head>
<body><main class="scene"><i class="paper"></i><i class="slash"></i><div class="bus-stage" aria-hidden="true"><img src="../assets/back-to-school/school-bus.png" alt=""><strong class="bus-name">BIG-Z</strong><i class="bus-lamp lamp-red-left"></i><i class="bus-lamp lamp-amber-left"></i><i class="bus-lamp lamp-amber-right"></i><i class="bus-lamp lamp-red-right"></i></div><div class="logo"><img src="../assets/franklin-lower-third-mark.png" alt=""><span>FRANKLIN CHAPEL</span></div><section class="copy"><p class="kicker">WE BELIEVE GOD</p><h1 class="main">BACK 2<br>SCHOOL</h1></section><div class="corner">A NEW SCHOOL YEAR<br>WITH FAITH IN FRONT</div></main></body>
</html>
