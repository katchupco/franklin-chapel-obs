<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Franklin Chapel Stream Test</title>
  <style>
    :root{--purple:#812be7;--violet:#ba6cff;--gold:#ffc928;--ink:#060408;--white:#f8f5fb}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink);font-family:Arial,Helvetica,sans-serif;color:var(--white)}
    .test-screen{position:relative;width:100vw;height:100vh;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 82% 28%,rgba(145,49,225,.5),transparent 31%),radial-gradient(circle at 20% 91%,rgba(112,34,183,.25),transparent 33%),linear-gradient(120deg,#050307 0%,#110819 52%,#311047 100%)}
    .grid{position:absolute;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:54px 54px;mask-image:linear-gradient(90deg,#000,transparent 82%)}
    .scan{position:absolute;z-index:0;top:-30%;left:-24%;width:24%;height:160%;background:linear-gradient(100deg,transparent,rgba(185,108,255,.16),rgba(255,255,255,.23),transparent);filter:blur(24px);transform:rotate(-9deg);animation:scan 8s ease-in-out infinite}
    .safe{position:absolute;z-index:8;inset:3.2%;border:1px solid rgba(255,255,255,.16);pointer-events:none}.safe::before,.safe::after{content:"";position:absolute;width:70px;height:70px}.safe::before{top:-1px;left:-1px;border-top:4px solid var(--gold);border-left:4px solid var(--gold)}.safe::after{right:-1px;bottom:-1px;border-right:4px solid var(--gold);border-bottom:4px solid var(--gold)}
    header{position:absolute;z-index:5;top:6.3%;right:6.3%;left:6.3%;display:flex;align-items:center;gap:18px}.logo{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(174,86,255,.38))}.brand{display:grid;gap:4px}.brand strong{font-size:23px;letter-spacing:.18em}.brand span{color:rgba(255,255,255,.62);font-size:11px;font-weight:800;letter-spacing:.2em}.test-pill{margin-left:auto;padding:15px 22px;border:1px solid rgba(255,201,40,.58);background:rgba(13,7,18,.72);box-shadow:inset 0 -3px var(--gold);font-size:15px;font-weight:950;letter-spacing:.16em}.test-pill i{display:inline-block;width:10px;height:10px;margin-right:10px;border-radius:50%;background:#ff315f;box-shadow:0 0 16px rgba(255,49,95,.9);animation:pulse 1.5s ease-in-out infinite}
    .hero{position:absolute;z-index:4;top:23%;left:6.3%;width:65%}.eyebrow{display:flex;align-items:center;gap:13px;color:var(--gold);font-size:15px;font-weight:950;letter-spacing:.22em}.eyebrow::before{content:"";width:68px;height:4px;background:linear-gradient(90deg,var(--gold),#ff527f)}h1{margin:22px 0 0;font-family:"Arial Black",Impact,sans-serif;font-size:clamp(82px,10vw,192px);line-height:.77;letter-spacing:-.075em;text-transform:uppercase;text-shadow:4px 5px 0 #d92c78,10px 12px 0 rgba(87,21,128,.82),0 25px 55px rgba(0,0,0,.55)}h1 span{display:block;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.92);text-shadow:none}.notice{display:inline-flex;margin-top:29px;padding:13px 19px;color:#1c0d25;background:linear-gradient(#ffe16a,var(--gold));font-size:16px;font-weight:950;letter-spacing:.13em;box-shadow:0 12px 28px rgba(0,0,0,.3)}
    .motion-orb{position:absolute;z-index:2;top:20%;right:5.8%;width:310px;aspect-ratio:1;border:1px solid rgba(255,255,255,.13);border-radius:50%;box-shadow:0 0 80px rgba(137,43,224,.27),inset 0 0 65px rgba(184,101,255,.12);animation:float 5s ease-in-out infinite}.motion-orb::before,.motion-orb::after{content:"";position:absolute;border-radius:50%}.motion-orb::before{inset:23px;border:4px solid transparent;border-top-color:var(--gold);border-right-color:rgba(255,255,255,.65);animation:spin 5s linear infinite}.motion-orb::after{inset:70px;background:radial-gradient(circle at 35% 30%,#c483ff,#7b27d7 48%,#170922 74%);box-shadow:0 0 35px rgba(171,79,255,.56)}.motion-orb b{position:absolute;z-index:2;inset:0;display:grid;place-items:center;font-size:31px;letter-spacing:.1em}
    .checks{position:absolute;z-index:5;right:6.3%;bottom:17.5%;display:grid;width:39%;grid-template-columns:repeat(2,1fr);gap:10px}.check{min-height:86px;padding:17px 19px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,rgba(9,5,13,.9),rgba(50,17,70,.72));box-shadow:0 15px 35px rgba(0,0,0,.24)}.check span{display:block;color:var(--violet);font-size:11px;font-weight:900;letter-spacing:.17em}.check strong{display:block;margin-top:8px;font-size:19px;letter-spacing:.04em}.meters{display:flex;align-items:end;gap:4px;height:20px;margin-top:9px}.meters i{width:7px;height:30%;background:var(--gold);animation:meter .8s ease-in-out infinite alternate}.meters i:nth-child(2){height:75%;animation-delay:-.35s}.meters i:nth-child(3){height:45%;animation-delay:-.6s}.meters i:nth-child(4){height:90%;animation-delay:-.2s}.meters i:nth-child(5){height:58%;animation-delay:-.5s}
    footer{position:absolute;z-index:5;right:6.3%;bottom:6%;left:6.3%;display:grid;grid-template-columns:1fr auto;align-items:end;gap:30px}.bars{display:flex;height:44px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}.bars i{flex:1}.bars i:nth-child(1){background:#fff}.bars i:nth-child(2){background:#ffe220}.bars i:nth-child(3){background:#22d5d5}.bars i:nth-child(4){background:#54d947}.bars i:nth-child(5){background:#e93aaf}.bars i:nth-child(6){background:#ef3838}.bars i:nth-child(7){background:#3155dd}.clock{text-align:right}.clock strong{display:block;font-size:30px;letter-spacing:.08em}.clock span{color:rgba(255,255,255,.62);font-size:11px;font-weight:800;letter-spacing:.16em}.frame-counter{position:absolute;left:6.3%;bottom:12.4%;color:rgba(255,255,255,.52);font-family:monospace;font-size:12px;letter-spacing:.12em}
    @keyframes scan{0%,15%{transform:translateX(0) rotate(-9deg)}75%,100%{transform:translateX(620%) rotate(-9deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-9px)}}@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}@keyframes meter{to{height:100%;background:#ff527f}}
    @media(max-width:1100px){.motion-orb{width:210px}.checks{width:43%}.check{min-height:65px;padding:11px}.hero{width:70%}}
  </style>
</head>
<body>
  <main class="test-screen">
    <i class="grid"></i><i class="scan"></i><div class="safe"></div>
    <header><img class="logo" src="../assets/franklin-lower-third-mark.png" alt=""><div class="brand"><strong>FRANKLIN CHAPEL</strong><span>LIVE BROADCAST SYSTEM</span></div><div class="test-pill"><i></i>TEST MODE</div></header>
    <section class="hero"><div class="eyebrow">PRE-BROADCAST CHECK</div><h1>TEST <span>SIGNAL</span></h1><div class="notice">NOT LIVE • INTERNAL TEST ONLY</div></section>
    <div class="motion-orb" aria-hidden="true"><b>30 FPS</b></div>
    <section class="checks">
      <article class="check"><span>01 • VIDEO</span><strong>CHECK FOCUS + FRAMING</strong></article>
      <article class="check"><span>02 • AUDIO</span><strong>CHECK SPEECH + MUSIC</strong><div class="meters"><i></i><i></i><i></i><i></i><i></i></div></article>
      <article class="check"><span>03 • NETWORK</span><strong>CHECK BITRATE + DROPS</strong></article>
      <article class="check"><span>04 • OUTPUT</span><strong>CHECK STREAM + RECORDING</strong></article>
    </section>
    <div class="frame-counter" id="frameCounter">MOTION CHECK • FRAME 000000</div>
    <footer><div class="bars" aria-label="Color reference bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="clock"><strong id="clock">00:00:00</strong><span id="date">STREAM TEST</span></div></footer>
  </main>
  <script>
    const clock=document.querySelector('#clock'),date=document.querySelector('#date'),counter=document.querySelector('#frameCounter');let frame=0;
    const tick=()=>{const now=new Date();clock.textContent=new Intl.DateTimeFormat('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);date.textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(now).toUpperCase()};
    const count=()=>{counter.textContent=`MOTION CHECK • FRAME ${String(frame++).padStart(6,'0')}`;requestAnimationFrame(count)};tick();setInterval(tick,250);count();
  </script>
</body>
</html>
