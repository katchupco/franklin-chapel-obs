<!doctype html><html><head><meta charset="utf-8"><title>Celebration of Life Preview</title><style>*{box-sizing:border-box}body{margin:0;padding:28px;background:#08070a;color:#fff;font-family:Arial}h1{margin:0 0 24px;font-family:Georgia;font-weight:400}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}article{border:1px solid #302a34;background:#100d13}h2{margin:0;padding:13px 16px;font-size:13px;letter-spacing:.08em}.frame{position:relative;aspect-ratio:16/9;overflow:hidden}.frame iframe{position:absolute;width:1920px;height:1080px;border:0;transform-origin:0 0}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Franklin Chapel • Celebration of Life</h1><div class="grid" id="grid"></div><script>const scenes=[["00 • In Loving Memory","20-memorial.html"],["01 • Service Beginning Soon","21-memorial-soon.html"],["02 • Celebration of Life","22-memorial-live.html"],["03 • Scripture Reading","23-memorial-scripture.html"],["04 • Musical Selection","24-memorial-music.html"],["05 • Photo Tribute","25-memorial-tribute.html"],["06 • Service Paused","26-memorial-pause.html"],["07 • Final Farewell","27-memorial-farewell.html"]];const grid=document.getElementById("grid");scenes.forEach(([n,f])=>{const a=document.createElement("article");a.innerHTML=`<h2>${n}</h2><div class="frame"><iframe src="${f}"></iframe></div>`;grid.append(a)});const resize=()=>document.querySelectorAll(".frame").forEach(f=>f.firstElementChild.style.transform=`scale(${f.clientWidth/1920})`);new ResizeObserver(resize).observe(grid);resize()</script></body></html>
