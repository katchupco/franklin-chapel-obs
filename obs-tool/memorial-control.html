<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memorial Control</title><link rel="stylesheet" href="memorial-control.css?v=2"></head><body><header><img src="../assets/franklin-lower-third-mark.png" alt=""><div><strong>CELEBRATION OF LIFE</strong><span>MEMORIAL SCENE CONTROL</span></div></header><main><section class="photo-tool"><div class="photo-preview" id="photoPreview"><span>ADD PORTRAIT</span></div><div class="photo-options"><label>Person's photo<input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Photo position<select id="photoPosition"><option value="top">Show more of the top</option><option value="center" selected>Centered</option><option value="bottom">Show more of the bottom</option></select></label><button class="remove" id="removePhoto" type="button">REMOVE PHOTO</button></div></section><label>Full name<input id="name" value="FULL NAME"></label><label>Life dates<input id="dates" value="JANUARY 1, 1940 — JULY 1, 2026"></label><label>Memorial line<input id="detail" value="A LIFE WELL LIVED. A LEGACY REMEMBERED."></label><label>Scripture text<textarea id="scripture" rows="3">“I am the resurrection, and the life.”</textarea></label><label>Scripture reference<input id="reference" value="JOHN 11:25"></label><label>Musical selection<input id="music" value="SELECTION TITLE"></label><label>Vocalist / musician<input id="musician" value="VOCALIST / MUSICIAN"></label><label>Service/location line<input id="service" value="FRANKLIN CHAPEL AME ZION CHURCH • LAURINBURG, NORTH CAROLINA"></label><button id="update">UPDATE ALL MEMORIAL SCENES</button><p>The portrait is resized automatically and stored only on this OBS computer. All information updates every memorial scene together.</p></main><script src="memorial-control.js?v=2"></script></body></html>
