<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Franklin Chapel Sermon Scene Control</title>
  <link rel="stylesheet" href="sermon-control.css">
</head>
<body>
  <header>
    <img src="../assets/franklin-lower-third-mark.png" alt="">
    <div><strong>SERMON + PRESENTATION</strong><span>LIVE SCENE CONTROL</span></div>
  </header>
  <main>
    <label>Kicker<input id="kicker" value="TODAY’S MESSAGE"></label>
    <label>Sermon title<textarea id="title" rows="2">MESSAGE TITLE</textarea></label>
    <label>Pastor / speaker<input id="speaker" value="PASTOR / SPEAKER"></label>
    <label>Scripture reference<input id="scripture" value="BOOK 1:1"></label>
    <section class="actions">
      <button id="update">UPDATE LIVE TEXT</button>
      <label class="switch">
        <input id="visible" type="checkbox" checked>
        <span><i></i></span>
        <b>ON AIR</b>
      </label>
    </section>
    <p>Changes save automatically. Use “Update Live Text” for a smooth animated refresh.</p>
  </main>
  <script src="sermon-control.js"></script>
</body>
</html>
