<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Homecoming OBS Preview</title><style>*{box-sizing:border-box}body{margin:0;background:#080710;color:#fff;font-family:Arial,sans-serif}header{padding:50px 5vw;background:linear-gradient(135deg,#2b0f4a,#0b0915);border-bottom:2px solid #f0b342}header span{color:#f0b342;font-size:12px;font-weight:900;letter-spacing:.2em}h1{margin:10px 0 0;font-size:52px}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;padding:36px 4vw 70px}.card h2{font:28px Georgia,serif}.card a{color:#f0b342}.shell{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid #41225c;background:#111;box-shadow:0 18px 50px rgba(0,0,0,.35)}iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}.live-note{position:absolute;z-index:2;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.15);font-size:38px;font-weight:900;letter-spacing:.12em}@media(max-width:900px){main{grid-template-columns:1fr}}</style></head><body><header><span>FRANKLIN CHAPEL • 150 YEARS</span><h1>Homecoming OBS scene preview.</h1></header><main id="gallery"></main><script>const scenes=[["Event Flyer","01-event-flyer.html"],["Starting Soon","02-starting-soon.html"],["15-Minute Countdown","03-countdown.html"],["Live Worship Overlay","04-live-worship.html",true],["Guest Speaker Lower Third","05-guest-lower-third.html",true],["Pastor Lower Third","06-host-lower-third.html",true],["Scripture","07-scripture.html"],["Giving Full Screen","08-giving-slide.html"],["Giving Over Camera","09-giving-overlay.html",true],["Be Right Back","10-be-right-back.html"],["Service Ending","11-service-ending.html"],["Branded Transition","13-transition.html"]];const gallery=document.getElementById('gallery');function resize(){document.querySelectorAll('.shell').forEach(s=>{const f=s.querySelector('iframe');f.style.transform=`scale(${s.clientWidth/1920})`;});}scenes.forEach(([name,file,transparent])=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${name} • <a href="${file}" target="_blank">Open full size</a></h2><div class="shell">${transparent?'<div class="live-note">LIVE CAMERA AREA</div>':''}<iframe src="${file}"></iframe></div>`;gallery.appendChild(card)});addEventListener('resize',resize);setTimeout(resize,150);</script></body></html>
