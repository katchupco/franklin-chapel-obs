<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laurinburg District Conference</title><link rel="stylesheet" href="theme.css"></head><body><main class="stage"><div class="grain"></div><div class="light"></div><div id="screen"></div></main><script>
const scene=new URLSearchParams(location.search).get('scene')||'welcome';
const overlayDefault={name:'DR. CHALMERS McDOUGALD',role:'PRESIDING ELDER',reference:'ISAIAH 40:31',text:'But they that wait upon the Lord shall renew their strength.',lowerVisible:false,scriptureVisible:false};
const brand=`<div class="brand"><div class="brand-bars"><i></i><i></i><i></i></div><div class="brand-copy"><b>Laurinburg District</b><span>African Methodist Episcopal Zion</span></div></div>`;
const venueInfo=`<div class="location"><b>Franklin Chapel A.M.E. Zion Church</b><br>1103 S. Caledonia Road &nbsp;•&nbsp; Laurinburg, NC 28352</div>`;
const screens={
welcome:`${brand}<div class="rule top"></div><section class="conference"><div class="label">2026 District Gathering</div><h1>District<span>Conference</span></h1><div class="date">September 11 <em>•</em> 7:00 PM</div>${venueInfo}</section><div class="corner-title"><b><span>Reach</span><span>Teach</span><span>Disciple</span></b></div><div class="rule bottom"></div>`,
soon:`${brand}<section class="page-center"><div><div class="eyebrow">Laurinburg District • African Methodist Episcopal Zion</div><h2>We’ll Begin<br>Soon</h2><p>Prepare your heart for an evening of worship, vision, and connection.</p><div class="badge">District Conference • September 11 • 7:00 PM</div></div></section>`,
live:`<section class="live"><div class="live-district-brand"><div class="district-bars"><i></i><i></i><i></i><i></i></div><div><b>Laurinburg District</b><span>African Methodist Episcopal Zion</span><small>Reach • Teach • Disciple</small></div></div><div class="live-status"><span class="live-dot"></span><b>Live</b><span>District Conference</span></div><div class="district-badge" aria-label="Laurinburg District and Franklin Chapel"><span class="badge-orbit orbit-one"></span><span class="badge-orbit orbit-two"></span><div class="badge-ld"><i></i><i></i><i></i><b>LD</b><em>District</em></div><div class="badge-church"><img src="../assets/district-conference/franklin-chapel-white-mark.png" alt="Franklin Chapel"></div></div></section>`,
scripture:`${brand}<section class="scripture"><div class="ref">Scripture Reading • Isaiah 40:31</div><q>But they that wait upon the Lord shall renew their strength.</q></section>`,
agenda:`${brand}<section class="agenda"><div><div class="label">Gather • Worship • Serve</div><h2>Tonight’s<br>Gathering</h2><p style="font-size:clamp(13px,1vw,22px);line-height:1.6;letter-spacing:.09em;color:#fff1ca;text-transform:uppercase">A sacred night of fellowship, praise, and district vision.</p></div><ul><li><span>01</span> Opening Worship</li><li><span>02</span> District Word</li><li><span>03</span> Conference Business</li><li><span>04</span> Closing Prayer</li></ul></section>`,
offering:`${brand}<section class="offering"><div><div class="label">Support the Work</div><h2>Giving<br>Moment</h2><p style="font-size:clamp(13px,1vw,22px);line-height:1.6;letter-spacing:.09em;color:#fff1ca;text-transform:uppercase">Your generosity strengthens ministry across the Laurinburg District.</p></div><div class="give-box"><b>Give</b><span>FranklinChapel.org/Give</span><small>Thank you for sowing into the work of the church.</small></div></section>`,
break:`${brand}<section class="page-center"><div><div class="eyebrow">District Conference</div><h2>Brief<br>Intermission</h2><p>We’ll return shortly. Thank you for worshiping with us.</p><div class="badge">Franklin Chapel A.M.E. Zion Church</div></div></section>`,
closing:`${brand}<section class="page-center"><div><div class="eyebrow">Laurinburg District</div><h2>Thank You<br>For Joining Us</h2><p>May the grace of God go with you until we gather again.</p><div class="badge">Reach • Teach • Disciple</div></div></section>`,
transition:`<section class="transition"><div class="trans-copy"><b>Laurinburg<br>District</b><span>District Conference</span></div></section>`};
screens.lowerthird=`<section class="district-lower"><div class="district-lower-bars"><i></i><i></i><i></i></div><div><span id="lt-role">PRESIDING ELDER</span><b id="lt-name">DR. CHALMERS McDOUGALD</b><small>LAURINBURG DISTRICT • DISTRICT CONFERENCE</small></div></section>`;
screens.scriptureoverlay=`<section class="district-scripture"><div class="district-scripture-label">Scripture Reading</div><blockquote id="scripture-text">But they that wait upon the Lord shall renew their strength.</blockquote><b id="scripture-reference">ISAIAH 40:31</b></section>`;
if(scene==='live'){document.documentElement.classList.add('camera-ready'); if(new URLSearchParams(location.search).get('preview'))document.documentElement.classList.add('preview-mode');}
if(scene==='lowerthird'||scene==='scriptureoverlay')document.documentElement.classList.add('overlay-ready');
document.getElementById('screen').innerHTML=screens[scene]||screens.welcome;
if(scene==='lowerthird'||scene==='scriptureoverlay'){
  const channel=new BroadcastChannel('districtConferenceOverlay');
  const getState=()=>{try{return {...overlayDefault,...JSON.parse(localStorage.getItem('districtConferenceOverlay')||'{}')}}catch{return overlayDefault}};
  const render=(state)=>{const lower=scene==='lowerthird';document.querySelector(lower?'.district-lower':'.district-scripture').classList.toggle('active',lower?state.lowerVisible:state.scriptureVisible);if(lower){document.getElementById('lt-role').textContent=state.role;document.getElementById('lt-name').textContent=state.name}else{document.getElementById('scripture-text').textContent=state.text;document.getElementById('scripture-reference').textContent=state.reference}};
  channel.onmessage=e=>render({...overlayDefault,...e.data});window.addEventListener('storage',()=>render(getState()));const previewState=new URLSearchParams(location.search).get('preview')==='1';const initial=getState();render(previewState?{...initial,lowerVisible:scene==='lowerthird',scriptureVisible:scene==='scriptureoverlay'}:initial);
}
</script></body></html>
