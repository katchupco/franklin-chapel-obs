<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District Conference Overlay Control</title><style>body{margin:0;background:#100416;color:#fff;font:600 15px Arial,sans-serif;padding:22px}h1{margin:0 0 6px;color:#edcc76}.sub{color:#cdaaff;margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:18px}.panel{padding:18px;border:1px solid #754295;background:#180723}.panel h2{margin:0 0 14px;color:#f2d386;font-size:17px;letter-spacing:.08em;text-transform:uppercase}label{display:block;margin:12px 0 5px;color:#d5b3f3;font-size:11px;letter-spacing:.12em;text-transform:uppercase}input,textarea{width:100%;box-sizing:border-box;border:1px solid #603d79;background:#09030e;color:#fff;padding:11px;font:600 14px Arial}textarea{min-height:92px;resize:vertical}button{border:0;padding:12px 16px;margin:16px 8px 0 0;background:#8d2ad8;color:#fff;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}button.hide{background:#372044}.hint{margin-top:22px;color:#e7d8bb;line-height:1.5;font-size:12px}</style></head><body><h1>District Conference Overlays</h1><p class="sub">Use this as an OBS dock. The changes appear on the matching overlay source.</p><div class="grid"><section class="panel"><h2>Lower Third</h2><label>Role</label><input id="role" value="PRESIDING ELDER"><label>Name</label><input id="name" value="DR. CHALMERS McDOUGALD"><button onclick="showLower()">Show lower third</button><button class="hide" onclick="hideLower()">Hide</button></section><section class="panel"><h2>Scripture</h2><label>Reference</label><input id="reference" value="ISAIAH 40:31"><label>Verse</label><textarea id="text">But they that wait upon the Lord shall renew their strength.</textarea><button onclick="showScripture()">Show scripture</button><button class="hide" onclick="hideScripture()">Hide</button></section></div><p class="hint">Add both overlay links as Browser Sources above your camera source. Keep this page open as a Custom Browser Dock in OBS.</p><script>const key='districtConferenceOverlay',channel=new BroadcastChannel(key);const state=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return{}}};const save=next=>{const data={...state(),...next};localStorage.setItem(key,JSON.stringify(data));channel.postMessage(data)};const val=id=>document.getElementById(id).value;function showLower(){save({name:val('name'),role:val('role'),lowerVisible:true})}function hideLower(){save({lowerVisible:false})}function showScripture(){save({reference:val('reference'),text:val('text'),scriptureVisible:true})}function hideScripture(){save({scriptureVisible:false})}</script></body></html>
