<!doctype html><html><head><meta charset="utf-8"><title>District Conference OBS Preview</title><style>body{margin:0;background:#12071b;color:#fff;font:600 15px Arial,sans-serif;padding:28px}h1{margin:0 0 8px}p{color:#e5c980;margin:0 0 26px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:22px}.card{background:#08040d;border:1px solid #6e398b;padding:12px}.card b{display:block;padding:0 0 10px;color:#f0c868;letter-spacing:.12em;text-transform:uppercase}.frame{aspect-ratio:16/9;background:#000}.frame iframe{width:100%;height:100%;border:0}</style></head><body><h1>District Conference OBS Theme</h1><p>Laurinburg District • broadcast preview</p><div class="grid"><script>for(const [key,label] of Object.entries({welcome:'00 • Welcome',soon:'01 • Starting Soon',live:'02 • Live Service',scripture:'03 • Scripture',agenda:'04 • Conference Agenda',offering:'05 • Giving',break:'06 • Intermission',closing:'07 • Closing',transition:'T • Branded Transition'})){const preview=key==='live'?'&preview=1':'';document.write(`<div class="card"><b>${label}</b><div class="frame"><iframe src="index.html?scene=${key}${preview}"></iframe></div></div>`)}</script></div></body></html>
