<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>District Conference — Complete Preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#07030d;color:#faf5ff;font:600 15px Arial,sans-serif}header{max-width:1500px;margin:auto;padding:52px 4% 28px}header span{color:#e2b84f;font-size:12px;font-weight:900;letter-spacing:.18em}h1{margin:10px 0 6px;font-size:clamp(34px,5vw,72px);letter-spacing:-.055em}header p{color:#d8c6e6}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px;max-width:1500px;margin:auto;padding:20px 4% 80px}article{min-width:0}.meta{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;gap:12px}h2{margin:0;font-size:17px;letter-spacing:.04em}a{color:#e3bd61;font-size:12px;font-weight:900;letter-spacing:.08em;text-decoration:none;white-space:nowrap}a:hover{color:#fff}.shell{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid #5e3b76;background:linear-gradient(135deg,#170a21,#060208);box-shadow:0 18px 55px rgba(0,0,0,.3)}.shell:hover{border-color:#e0b64e}.shell iframe{position:absolute;inset:0;width:1920px;height:1080px;border:0;transform-origin:0 0;pointer-events:none}.live-note{position:absolute;z-index:2;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.16);font-size:clamp(18px,3vw,44px);font-weight:900;letter-spacing:.1em;pointer-events:none}@media(max-width:900px){main{grid-template-columns:1fr}}
</style></head><body><header><span>LAURINBURG DISTRICT • DISTRICT CONFERENCE</span><h1>Complete scene preview.</h1><p>Click <b>OPEN FULL SIZE</b> beside any scene to view it at full broadcast size.</p></header><main id="gallery"></main><script>
const scenes=[['00 • Welcome','welcome'],['01 • Starting Soon','soon'],['02 • Live Service','live',true],['03 • Scripture','scripture'],['04 • Conference Agenda','agenda'],['05 • Giving','offering'],['06 • Intermission','break'],['07 • Closing','closing'],['08 • Conference Lower Third','lowerthird',true],['09 • Scripture Overlay','scriptureoverlay',true],['T • Branded Transition','transition']];
const gallery=document.querySelector('#gallery');scenes.forEach(([name,scene,isOverlay])=>{const preview=isOverlay?'&preview=1':'';const url=`index.html?v=dc-final&scene=${scene}${preview}`;const card=document.createElement('article');card.innerHTML=`<div class="meta"><h2>${name}</h2><a href="${url}" target="_blank">OPEN FULL SIZE ↗</a></div><div class="shell">${scene==='live'?'<div class="live-note">CAMERA AREA</div>':''}<iframe src="${url}" title="${name}"></iframe></div>`;gallery.append(card)});const resize=()=>document.querySelectorAll('.shell').forEach(shell=>shell.querySelector('iframe').style.transform=`scale(${shell.clientWidth/1920})`);new ResizeObserver(resize).observe(gallery);resize();
</script></body></html>
